                                - generic: "### 背景介绍 因为什么原因，遇到了什么问题… ### 需求分析 使用/superpowers: brainstorm技能分析需求： 新做一个模块来解决什么问题，功能需要包含 ### 编写执行计划 使用/superpowers:**writing-plan技能编写执行计划** ### 执行流程 1. /superpowers:**executing-plans 执行计划** 2. 使用**subagent-driven-development 技能开启当前任务** 3. 使用/superpowers:**test-driven-development 技能进行TDD测试驱动开发模式进行开发编程** ### 代码审查 1. 使用 /code-reviewer 审查代码 ### 验收清单 - [ ] 功能开发编译通过，项目正常启动 - [ ] 代码审查通过，无P0级别代码问题 - [ ] 测试覆盖率 > 80% - [ ] 文档更新 ### **Ralph-Loop 配置** - max-iterations: 15 - completion-promise: DEVELOP COMPLETE"
