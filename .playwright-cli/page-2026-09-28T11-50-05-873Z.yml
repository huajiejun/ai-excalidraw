                              - cell:
                                - generic: 先不要回答我的问题。请先执行以下操作： 1. 指出我在这个问题中隐含的假设； 2. 告诉我哪些关键信息缺失会显著改变你的答案； 3. 告诉我人们在处理这类问题时最常犯的一个错误。 最后，请向我提一个能让你最终答案真正产生价值的问题。 等我回答后，你再给出最终输出
