                              - cell:
                                - generic: /ralph-loop 实现一个xxxx功能 要求： 1. 使用 TDD 方式开发（先写测试再写实现） 2. 遇到 bug 使用 systematic-debugging 排查 3. 完成后运行 verification-before-completion 验证 4. 测试覆盖率 > 80% 完成标准： - 所有 CRUD 接口可用 - 输入验证到位 - 所有测试通过 - 至少完成项目启动E2E验收 - 输出 <promise>COMPLETE</promise> 卡住时（15 次迭代后仍未完成）： - 记录阻塞原因 - 列出已尝试的方案 - 建议替代方案
